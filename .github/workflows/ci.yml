name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test tests/SQLDiskMonitor.Tests/SQLDiskMonitor.Tests.csproj -c Release
      - name: Build app and MSI
        shell: pwsh
        run: ./build/build.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: artifacts/*.msi
