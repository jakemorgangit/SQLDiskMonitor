name: Release

# Push a tag like v2.1.0 to build the MSI and publish a GitHub release.
# Installed copies of SQL Disk Monitor check the latest release at startup and offer to upgrade.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        run: '"version=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'
      - name: Test
        run: dotnet test tests/SQLDiskMonitor.Tests/SQLDiskMonitor.Tests.csproj -c Release
      - name: Build app and MSI
        shell: pwsh
        run: ./build/build.ps1 -Version ${{ steps.v.outputs.version }}
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item artifacts/*.msi).FullName `
            --title "SQL Disk Monitor ${{ github.ref_name }}" --generate-notes
